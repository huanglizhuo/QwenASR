[workspace]
resolver = "2"
members = ["crates/qwen-asr", "crates/qwen-asr-cli"]
exclude = ["flutter/qwen_asr/rust"]  # Cargokit builds independently

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# x-release-please-start-version
qwen-asr = { version = "0.7.2", path = "crates/qwen-asr" }
# x-release-please-end

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
