name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The PAT shares its owner's GitHub API limits with every other tool on
      # the account, so Release Please can fail with "API rate limit already
      # exceeded" (2026-11-12: cleared within 15 minutes). It is idempotent,
      # so try three times before failing the job.
      - id: try1
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: steps.try1.outcome == 'failure'
        run: sleep 300

      - id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: steps.try2.outcome == 'failure'
        run: sleep 600

      - id: try3
        if: steps.try2.outcome == 'failure'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Re-export the successful attempt's release flags, verbatim, under the
      # step id the publishing steps below read.
      - id: release
        env:
          OUTPUTS: ${{ steps.try1.outcome == 'success' && toJSON(steps.try1.outputs) || steps.try2.outcome == 'success' && toJSON(steps.try2.outputs) || toJSON(steps.try3.outputs) }}
        run: |
          jq -r 'to_entries[] | select(.key == "releases_created" or (.key | endswith("--release_created"))) | "\(.key)=\(.value)"' <<<"$OUTPUTS" >> "$GITHUB_OUTPUT"

      # The steps below are executed ONLY if release-please creates a new release (PR gets merged)

      - name: Checkout Code
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@v4

      # --- 1. Publish Rust Library ---
      - name: Setup Rust
        if: ${{ steps.release.outputs['crates/qwen-asr--release_created'] }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        if: ${{ steps.release.outputs['crates/qwen-asr--release_created'] || steps.release.outputs['crates/qwen-asr-cli--release_created'] }}
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Publish to crates.io
        if: ${{ steps.release.outputs['crates/qwen-asr--release_created'] }}
        working-directory: crates/qwen-asr
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      # --- 2. Publish CLI Binary ---
      - name: Setup Rust (CLI)
        if: ${{ steps.release.outputs['crates/qwen-asr-cli--release_created'] }}
        uses: dtolnay/rust-toolchain@stable

      # Ensure qwen-asr is published before the CLI (recovers from a previously
      # failed qwen-asr publish where the GitHub release was created but crates.io
      # never received the crate).
      - name: Ensure qwen-asr is published to crates.io
        if: ${{ steps.release.outputs['crates/qwen-asr-cli--release_created'] }}
        working-directory: crates/qwen-asr
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish || echo "qwen-asr already published, continuing"

      - name: Wait for crates.io index
        if: ${{ steps.release.outputs['crates/qwen-asr-cli--release_created'] }}
        run: sleep 30

      - name: Publish CLI to crates.io
        if: ${{ steps.release.outputs['crates/qwen-asr-cli--release_created'] }}
        working-directory: crates/qwen-asr-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
