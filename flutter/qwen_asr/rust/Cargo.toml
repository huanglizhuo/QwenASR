[package]
name = "rust_lib_qwen_asr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"

# Apple platforms: use default features (blas via Accelerate)
[target.'cfg(target_vendor = "apple")'.dependencies]
qwen_asr = { package = "qwen-asr", path = "../../../crates/qwen-asr" }

# Android: disable blas (no OpenBLAS); enable INT8 decoder-prefill (R13 stage 1).
# The int8-prefill path compiles ONLY under this feature (+ not blas + aarch64),
# so it is Android-only at the build-graph level — apple/desktop/CLI never see it.
[target.'cfg(target_os = "android")'.dependencies]
qwen_asr = { package = "qwen-asr", path = "../../../crates/qwen-asr", default-features = false, features = ["int8-prefill"] }

# Linux (desktop): use default features (blas via OpenBLAS)
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
qwen_asr = { package = "qwen-asr", path = "../../../crates/qwen-asr", default-features = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
