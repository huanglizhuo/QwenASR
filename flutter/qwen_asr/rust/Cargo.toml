[package]
name = "rust_lib_qwen_asr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"

# Apple platforms: use default features (blas via Accelerate)
[target.'cfg(target_vendor = "apple")'.dependencies]
qwen_asr = { package = "qwen-asr", path = "../../../crates/qwen-asr" }

# Android: disable blas (no OpenBLAS); enable INT8 decoder-prefill (R13 stage 1)
# and INT8 encoder weight GEMMs (R13 stage 2). Both paths compile ONLY under
# their feature (+ not blas + aarch64), so they are Android-only at the
# build-graph level — apple/desktop/CLI never see them. Independent features so
# either can be rolled back (drop from this list) without touching the other.
[target.'cfg(target_os = "android")'.dependencies]
qwen_asr = { package = "qwen-asr", path = "../../../crates/qwen-asr", default-features = false, features = ["int8-prefill", "int8-encoder"] }

# Linux (desktop): use default features (blas via OpenBLAS)
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
qwen_asr = { package = "qwen-asr", path = "../../../crates/qwen-asr", default-features = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
